name: example_client
description: Integration and platform smoke-test client for the DAKit DeviantArt SDK.
publish_to: none
resolution: workspace
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  dakit_flutter: any
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  msix: ^3.18.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

msix_config:
  display_name: DAKit Example
  publisher_display_name: DAKit
  identity_name: io.github.redtidev1918.dakit.example-client
  protocol_activation: dakit
  capabilities: internetClient
  install_certificate: false
