{
  "kind": "binary",
  "versioning": {
    "mode": "release-please",
    "package": "packages/dakit_cli"
  },
  "tag": {
    "template": "dakit_cli-v{version}"
  },
  "build": {
    "test": "flutter analyze && flutter test packages/dakit_cli/test",
    "flutter_version": "3.47.1",
    "matrix": [
      {
        "runner": "ubuntu-24.04",
        "command": "TARGET=linux-x64 scripts/build-release"
      },
      {
        "runner": "ubuntu-24.04",
        "command": "TARGET=linux-arm64 scripts/build-release"
      },
      {
        "runner": "macos-15",
        "command": "TARGET=macos-arm64-unsigned-preview scripts/build-release"
      },
      {
        "runner": "macos-15-intel",
        "command": "TARGET=macos-x64-unsigned-preview scripts/build-release"
      },
      {
        "runner": "windows-2025",
        "command": "TARGET=windows-x64 scripts/build-release"
      }
    ]
  },
  "assets": {
    "required": [
      "dakit-cli-*-linux-x64.tar.gz",
      "dakit-cli-*-linux-arm64.tar.gz",
      "dakit-cli-*-macos-arm64-unsigned-preview.tar.gz",
      "dakit-cli-*-macos-x64-unsigned-preview.tar.gz",
      "dakit-cli-*-windows-x64.zip"
    ],
    "optional": []
  },
  "registries": {
    "github": {
      "required": true
    }
  },
  "release": {
    "post_publish": "python3 .github/scripts/update_download_page.py && git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add docs/download.md && (git diff --cached --quiet || (git commit -m 'docs: update release download page' && git push))"
  },
  "retention": {
    "stable": 1,
    "prerelease": 1,
    "failed_draft": 2,
    "pruneStable": true
  },
  "checksums": true,
  "sbom": false,
  "repository": {
    "git": {
      "productionOperations": {
        "base": "default",
        "branches": [
          "chore/cutover-*",
          "ops/*",
          "release/*",
          "hotfix/*"
        ],
        "requireLatestBase": true
      }
    }
  }
}
