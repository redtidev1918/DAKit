name: Release

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      version: {description: "Existing dakit_cli version; blank reads the manifest", required: false, type: string}
      dry_run: {description: "Build and validate without publishing", required: false, default: false, type: boolean}
      force: {description: "Rerun a healthy version", required: false, default: false, type: boolean}
      repair: {description: "Repair the current incomplete version", required: false, default: false, type: boolean}
      stage: {description: "Recovery stage label", required: false, default: all, type: string}

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write
  id-token: write

jobs:
  # Release Please owns the version bump; pub.dev truth decides whether OIDC publishing is needed.
  release:
    uses: redtidev1918/releasegraph/.github/workflows/reusable-release.yml@d6d0bbec4e37bec025ab13de1783d4af96d6f925 # ReleaseGraph v1.4.8
    with:
      version: ${{ inputs.version || '' }}
      dry_run: ${{ github.event_name == 'pull_request' || inputs.dry_run || false }}
      force: ${{ github.event_name == 'pull_request' || inputs.force || false }}
      repair: ${{ github.event_name == 'pull_request' || inputs.repair || false }}
      stage: ${{ inputs.stage || 'all' }}
    secrets: inherit

  detect-pub:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.versions.outputs.core }}
      api: ${{ steps.versions.outputs.api }}
      flutter: ${{ steps.versions.outputs.flutter }}
      web: ${{ steps.versions.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          for package in ("dakit_core", "dakit_api", "dakit_flutter", "dakit_web"):
              local = next(
                  line.split(":", 1)[1].strip()
                  for line in open(f"packages/{package}/pubspec.yaml")
                  if line.startswith("version:")
              )
              latest = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          f"https://pub.dev/api/packages/{package}",
                          headers={"User-Agent": "dakit-release-workflow"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          latest = json.load(response).get("latest", {}).get("version")
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(attempt + 1)
              key = package.removeprefix("dakit_")
              print(f"{key}={str(latest != local).lower()}")
          PY

  pub-core:
    needs: [release, detect-pub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pub.outputs.core == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/dakit_core
    permissions:
      id-token: write

  pub-api:
    needs: [release, detect-pub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pub.outputs.api == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/dakit_api
    permissions:
      id-token: write

  pub-flutter:
    needs: [release, detect-pub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pub.outputs.flutter == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/dakit_flutter
    permissions:
      id-token: write

  pub-web:
    needs: [release, detect-pub]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-pub.outputs.web == 'true'
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    with:
      working-directory: packages/dakit_web
    permissions:
      id-token: write
