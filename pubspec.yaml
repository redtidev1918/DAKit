name: dakit_workspace
description: Workspace for the DAKit DeviantArt client SDK.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.1

workspace:
  - packages/dakit_core
  - packages/dakit_api
  - packages/dakit_flutter
  - packages/dakit_cli
  - packages/dakit_web
  - apps/example_client

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.6.0

melos:
  packages:
    - packages/*
    - apps/*

  command:
    version:
      workspaceChangelog: false
      updateGitTagRefs: true
      message: 'chore(release): publish packages'

  scripts:
    format:
      run: dart format --output=none --set-exit-if-changed .
      description: Check Dart formatting across the workspace.

    graph:
      run: dart run melos list --graph
      description: Print the workspace dependency graph.

    doc:
      run: |
        dart doc --output docs/api/dakit_core packages/dakit_core
        dart doc --output docs/api/dakit_api packages/dakit_api
        dart doc --output docs/api/dakit_flutter packages/dakit_flutter
      description: Generate API documentation for each public package.

    analyze:
      run: flutter analyze
      description: Analyze all Dart and Flutter packages.

    test:
      run: |
        flutter test \
          packages/dakit_core/test \
          packages/dakit_api/test \
          packages/dakit_flutter/test \
          packages/dakit_cli/test \
          packages/dakit_web/test \
          apps/example_client/test
      description: Run the full unit and widget test suite.

    test:coverage:
      run: |
        flutter test \
          packages/dakit_core/test \
          packages/dakit_api/test \
          packages/dakit_flutter/test \
          packages/dakit_cli/test \
          packages/dakit_web/test \
          apps/example_client/test \
          --coverage
      description: Run tests and collect coverage data.

    clean:
      run: flutter clean
      description: Clean Flutter build artifacts.

    publish:check:
      run: |
        dart pub publish --dry-run --directory packages/dakit_core
        dart pub publish --dry-run --directory packages/dakit_api
        dart pub publish --dry-run --directory packages/dakit_flutter
        dart pub publish --dry-run --directory packages/dakit_web
      description: Dry-run publishing for the public packages.
